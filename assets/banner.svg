<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    /* Dynamic glowing animations for background decorative elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes boneFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes jointPulse {
      0%, 100% { r: 5px; fill-opacity: 0.8; }
      50% { r: 8px; fill-opacity: 1; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    .orb-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 180px 100px; }
    .orb-2 { animation: pulseOrb 8s ease-in-out infinite 1s; transform-origin: 1020px 300px; }
    .rig-skeleton { animation: boneFloat 5s ease-in-out infinite; transform-origin: 1020px 210px; }
    .joint-node { animation: jointPulse 3s ease-in-out infinite; }
    .dynamic-line { stroke-dasharray: 6 4; animation: dashMove 4s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="180" cy="110" r="140" fill="#38bdf8" filter="url(#glowPurple)" opacity="0.3" />
  <circle class="orb-2" cx="1020" cy="270" r="160" fill="#8b5cf6" filter="url(#glowPurple)" opacity="0.35" />

  <!-- Ambient Rigging Wireframe Graphics on Right Side (Foreground safe) -->
  <g class="rig-skeleton" opacity="0.85">
    <!-- Center Humanoid Armature Kinematic Lines -->
    <path class="dynamic-line" d="M 1020 90 L 1020 160 L 970 210 L 950 290" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path class="dynamic-line" d="M 1020 160 L 1070 210 L 1090 290" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path class="dynamic-line" d="M 1020 160 L 1020 250 L 990 340 L 980 390" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" />
    <path class="dynamic-line" d="M 1020 250 L 1050 340 L 1060 390" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" />

    <!-- Joint Nodes -->
    <circle cx="1020" cy="90" class="joint-node" r="7" fill="#38bdf8" />
    <circle cx="1020" cy="160" class="joint-node" r="6" fill="#06b6d4" />
    <circle cx="970" cy="210" class="joint-node" r="5" fill="#a855f7" />
    <circle cx="1070" cy="210" class="joint-node" r="5" fill="#a855f7" />
    <circle cx="950" cy="290" class="joint-node" r="5" fill="#f43f5e" />
    <circle cx="1090" cy="290" class="joint-node" r="5" fill="#f43f5e" />
    <circle cx="1020" cy="250" class="joint-node" r="6" fill="#38bdf8" />
    <circle cx="990" cy="340" class="joint-node" r="5.5" fill="#a855f7" />
    <circle cx="1050" cy="340" class="joint-node" r="5.5" fill="#a855f7" />
    <circle cx="980" cy="390" class="joint-node" r="5" fill="#10b981" />
    <circle cx="1060" cy="390" class="joint-node" r="5" fill="#10b981" />

    <!-- 3D Transform Gizmo Ring -->
    <ellipse cx="1020" cy="250" rx="70" ry="25" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.75" />
    <ellipse cx="1020" cy="160" rx="95" ry="32" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Left/Center Content Area: Title & Subtitle in crisp Foreground -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 60)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="16" r="6" fill="#10b981" />
      <text x="34" y="21" class="pill-text" fill="#38bdf8">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" fill="url(#titleGrad)">Awesome 3D Character Rigging &amp; Animation</text>

    <!-- Subtitle Description -->
    <text x="0" y="190" class="subtitle-text">Automated Auto-Rigging, Skin Weighting, AI Mocap &amp; Neural Motion Suites</text>
    <text x="0" y="218" class="subtitle-text" fill="#64748b" font-size="16">Production-ready pipelines for Blender, Unreal Engine, Maya, Unity &amp; Godot</text>

    <!-- Dynamic Feature Pills (Foreground Highlights) -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: Auto-Rigging -->
      <g transform="translate(0, 0)">
        <rect width="185" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#38bdf8" />
        <text x="34" y="26" class="pill-text" fill="#f1f5f9">⚡ Auto-Rigging</text>
      </g>

      <!-- Pill 2: AI Motion Capture -->
      <g transform="translate(200, 0)">
        <rect width="215" height="42" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#a855f7" />
        <text x="34" y="26" class="pill-text" fill="#f1f5f9">🎥 AI Motion Capture</text>
      </g>

      <!-- Pill 3: Skin Weighting -->
      <g transform="translate(430, 0)">
        <rect width="195" height="42" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#f43f5e" />
        <text x="34" y="26" class="pill-text" fill="#f1f5f9">🎨 Skin Weighting</text>
      </g>

      <!-- Pill 4: Text to Motion -->
      <g transform="translate(640, 0)">
        <rect width="200" height="42" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#10b981" />
        <text x="34" y="26" class="pill-text" fill="#f1f5f9">🤖 Text-to-Motion</text>
      </g>
    </g>

    <!-- Bottom Specs / Supported Formats -->
    <g transform="translate(0, 340)">
      <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#64748b">SUPPORTED PIPELINES &amp; FORMATS:</text>
      <text x="230" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">FBX  •  GLTF / GLB  •  BVH  •  USD  •  Blender Rigify  •  Maya HumanIK  •  Unreal Mannequin</text>
    </g>
  </g>
</svg>
