<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="45%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="accentGold" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#10b981"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".45" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(15px,-10px);opacity:.65}}@keyframes boneFloat{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes jointPulse{0%{r:5px;fill-opacity:.8}50%{r:8px;fill-opacity:1}}@keyframes dashMove{0%{stroke-dashoffset:0}}.title-text{font-weight:800;font-size:42px;letter-spacing:-.5px}.pill-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;letter-spacing:.3px}.orb-1{animation:pulseOrb 6s ease-in-out infinite;transform-origin:180px 100px}.orb-2{animation:pulseOrb 8s ease-in-out infinite 1s;transform-origin:1020px 300px}.rig-skeleton{animation:boneFloat 5s ease-in-out infinite;transform-origin:1020px 210px}.joint-node{animation:jointPulse 3s ease-in-out infinite}.dynamic-line{stroke-dasharray:6 4;animation:dashMove 4s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" rx="16"/><rect width="1200" height="420" fill="url(#gridPattern)" rx="16"/><circle cx="180" cy="110" r="140" fill="#38bdf8" class="orb-1" filter="url(#glowPurple)" opacity=".3"/><circle cx="1020" cy="270" r="160" fill="#8b5cf6" class="orb-2" filter="url(#glowPurple)" opacity=".35"/><g class="rig-skeleton" opacity=".85"><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="3" d="M 1020 90 L 1020 160 L 970 210 L 950 290" class="dynamic-line"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="3" d="M 1020 160 L 1070 210 L 1090 290" class="dynamic-line"/><path fill="none" stroke="#a855f7" stroke-linecap="round" stroke-width="3.5" d="M 1020 160 L 1020 250 L 990 340 L 980 390" class="dynamic-line"/><path fill="none" stroke="#a855f7" stroke-linecap="round" stroke-width="3.5" d="M 1020 250 L 1050 340 L 1060 390" class="dynamic-line"/><circle cx="1020" cy="90" r="7" fill="#38bdf8" class="joint-node"/><circle cx="1020" cy="160" r="6" fill="#06b6d4" class="joint-node"/><circle cx="970" cy="210" r="5" fill="#a855f7" class="joint-node"/><circle cx="1070" cy="210" r="5" fill="#a855f7" class="joint-node"/><circle cx="950" cy="290" r="5" fill="#f43f5e" class="joint-node"/><circle cx="1090" 